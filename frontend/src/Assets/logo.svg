          stroke-width: 1;
        }

        .slop-logo-brand {
          fill: #B8C4FF;
        }

        .slop-logo-ui {
          fill: #EDEAE6;
        }
      }
    </style>
  </defs>
  <rect class="slop-logo-pill" x="0" y="0" width="244" height="56" rx="8" />
  <text class="slop-logo-brand" x="63.68" y="41.13" font-family="Manrope, sans-serif" font-weight="800" font-size="36">Slop</text>
  <text class="slop-logo-ui" x="143.53" y="41.13" font-family="Manrope, sans-serif" font-weight="800" font-size="36">UI</text>
</svg>
