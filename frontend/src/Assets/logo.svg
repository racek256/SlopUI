<svg width="244" height="56" viewBox="0 0 244 56" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@800&amp;display=swap');

      .slop-logo-pill {
        fill: #FCF9F8;
      }

      .slop-logo-brand {
        fill: #00288E;
      }

      .slop-logo-ui {
        fill: #1C1B1B;
      }

