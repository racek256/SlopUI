# ============================================================
# SearXNG settings.yml - hardened high-volume AI-agent instance
# ============================================================
# Design goals:
#   1. Engine rotation/redundancy: 25+ general engines enabled so a
#      blocked engine never kills result availability. Stable/low-block
#      engines are weighted higher; fragile (Google/Bing/Yahoo) lower.
#   2. Never suspend engines on CAPTCHA/429 for long (SearxEngineCaptcha: 0)
#      - with rotating egress the NEXT request comes from a clean IP.
#   3. Throttle outbound to avoid triggering rate-limits:
#      smaller pool_maxsize, retries_sleep/retry_sleep, per-engine timeouts.
#   4. JSON API-first: formats whitelist keeps HTML rendering overhead out
#      of the hot path; autocomplete/favicons off.
#   5. IPv4-only outbound (source_ips: 0.0.0.0) - fixes many Google/Bing
#      datacenter-IP issues.
#   6. User-Agent rotation is AUTOMATIC: SearXNG picks a random
#      Chrome/Firefox UA per request from searx/data/useragents.json.
#      No config needed; useragent_suffix stays empty to avoid fingerprinting.
#   7. Proxy pool support pre-wired (commented out) for egress rotation.
#
# Verified against image 2026.8.4-c63835bd2.
# ============================================================

use_default_settings:
  engines:
    remove:
      - google images
      - google videos
      - wikidata

server:
  limiter: false
  public_instance: false
  image_proxy: false
  method: GET
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Frame-Options: DENY
    X-XSS-Protection: "1; mode=block"
    Referrer-Policy: "no-referrer"

search:
  safe_search: 0
  autocomplete: ""
  favicon_resolver: ""
  default_lang: "en"
  formats:
    - html
    - json
  ban_time_on_fail: 5
  max_ban_time_on_fail: 90
  suspended_times:
    SearxEngineAccessDenied: 30
    SearxEngineCaptcha: 0
    SearxEngineTooManyRequests: 60
    cf_SearxEngineCaptcha: 3600
    cf_SearxEngineAccessDenied: 3600
    recaptcha_SearxEngineCaptcha: 86400

outgoing:
  request_timeout: 7.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 10
  enable_http2: true
  retries: 1
  retries_sleep: 1.0
  retry_sleep: 0.8
  max_redirects: 30
  source_ips: 0.0.0.0
  useragent_suffix: ""
  extra_proxy_timeout: 5
engines:
  # ================================================================
  # TIER 1 - STABLE / LOW-BLOCK (weight 2-3, dominate results)
  # These front-ends rarely CAPTCHA datacenter IPs.
  # ================================================================
  - name: duckduckgo
    weight: 3
    timeout: 6.0
  - name: brave
    weight: 3
    timeout: 6.0
  - name: mojeek
    disabled: false
    weight: 3
    timeout: 6.0
  - name: qwant
    disabled: false
    weight: 2
    timeout: 6.0
  - name: mwmbl
    disabled: false
    weight: 2
    timeout: 7.0
  - name: crowdview
    disabled: false
    weight: 2
    timeout: 7.0
  - name: yep
    disabled: false
    weight: 2
    timeout: 6.0
  - name: wiby
    disabled: false
    weight: 2
    timeout: 6.0
  - name: sepiasearch
    disabled: false
    weight: 2
    timeout: 6.0
  - name: yacy
    disabled: false
    weight: 1
    timeout: 7.0
  - name: swisscows
    disabled: false
    weight: 2
    timeout: 6.0
  - name: privacywall
    disabled: false
    weight: 2
    timeout: 6.0
  - name: searchmysite
    disabled: false
    weight: 1
    timeout: 7.0
  # ================================================================
  # TIER 2 - MODERATE / SPECIALTY (weight 1, good fallback)
  # ================================================================
  - name: startpage
    weight: 1
    timeout: 7.0
  - name: wikipedia
    weight: 1
    timeout: 5.0
  - name: openverse
    weight: 1
    timeout: 6.0
  - name: github
    inactive: false
    weight: 1
    timeout: 5.0
  - name: stackoverflow
    disabled: false
    weight: 1
    timeout: 6.0
  - name: openstreetmap
    disabled: false
    weight: 1
    timeout: 6.0
  - name: arxiv
    weight: 1
    timeout: 6.0
  - name: semantic scholar
    disabled: false
    weight: 1
    timeout: 7.0
  - name: openalex
    disabled: false
    weight: 1
    timeout: 7.0
  - name: crossref
    disabled: false
    weight: 1
    timeout: 7.0
  - name: pubmed
    disabled: false
    weight: 1
    timeout: 7.0
  - name: docker hub
    weight: 1
    timeout: 6.0
  # ================================================================
  # TIER 3 - FRAGILE / EASILY BLOCKED (weight 0.3-0.5, fast-fail)
  # Kept for redundancy but de-prioritized. Fast-fail so they don't
  # stall the whole query when blocked.
  # ================================================================
  - name: google
    engine: google
    inactive: false
    weight: 0.5
    timeout: 4.5
    retry_on_http_error: [403, 429]
    retries: 1
  - name: bing
    engine: bing
    disabled: false
    weight: 0.5
    timeout: 4.5
    retry_on_http_error: [429]
  - name: yahoo
    disabled: false
    weight: 0.5
    timeout: 4.5
    retry_on_http_error: [429]
  - name: yahoo news
    disabled: false
    weight: 0.3
    timeout: 4.5
  - name: google news
    inactive: false
    weight: 0.5
    timeout: 4.5
  - name: google scholar
    weight: 0.5
    timeout: 4.5
  - name: google cse
    weight: 0.3
    timeout: 4.5
  - name: yandex
    disabled: false
    weight: 0.5
    timeout: 4.5
    retry_on_http_error: [429]
  - name: mojeek images
    disabled: false
    weight: 0.3
    timeout: 5.0

preferences:
  lock:
    - autocomplete
    - method
    - language
    - safesearch
